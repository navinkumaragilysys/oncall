global:
  scrape_interval:     15s
  evaluation_interval: 15s
  scrape_timeout:      10s
  external_labels:
    cluster: oncall-local

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers: []

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  # Consul service discovery for all microservices
  - job_name: consul-services
    consul_sd_configs:
      - server: consul:8500
        datacenter: dc1
    relabel_configs:
      # Keep only services tagged 'metrics'
      - source_labels: [__meta_consul_service]
        target_label: service
      - source_labels: [__meta_consul_node]
        target_label: node
      - source_labels: [__meta_consul_service]
        regex: ".*-svc|gateway|config"
        action: keep
      # Keep gateway metrics scrape stable via docker DNS even when Consul advertises localhost:8090.
      - source_labels: [__meta_consul_service]
        regex: "oncall-gateway"
        target_label: __address__
        replacement: "gateway:8080"
      # Set metrics path based on service
      - source_labels: [__meta_consul_service]
        regex: ".*-svc|gateway|config"
        target_label: __metrics_path__
        replacement: "/prometheus"
      # Build target from consul metadata
      - source_labels: [__address__]
        regex: "([^:]+)(?::\\d+)?"
        replacement: "${1}:8080"
        target_label: __address__
    # Increase timeout for slow services on first scrape
    scrape_interval: 30s
    scrape_timeout: 10s
