groups:
  - name: oncall.service_health
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"

      - alert: HighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{outcome="SERVER_ERROR"}[5m])) by (job)
          /
          sum(rate(http_server_requests_seconds_count[5m])) by (job)
          > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on {{ $labels.job }}: {{ $value | humanizePercentage }}"

      - alert: HighHeapUsage
        expr: |
          sum(jvm_memory_used_bytes{area="heap"}) by (job)
          /
          sum(jvm_memory_max_bytes{area="heap"}) by (job)
          > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High JVM heap on {{ $labels.job }}: {{ $value | humanizePercentage }}"

  - name: oncall.infrastructure
    interval: 30s
    rules:
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is unreachable"
