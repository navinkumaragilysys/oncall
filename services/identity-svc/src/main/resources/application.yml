server:
  port: 8080

spring:
  application:
    name: identity-svc

  # ── Database (oncall_identity — isolated from all other services) ──────────
  datasource:
    url: ${oncall.db.url:jdbc:postgresql://localhost:5432/oncall_identity}
    username: ${oncall.db.user:oncall}
    password: ${oncall.db.password:oncall_dev_change_me}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      connection-timeout: 5000
      pool-name: identity-svc-pool

  # ── JPA ───────────────────────────────────────────────────────────────────
  jpa:
    hibernate:
      # Flyway owns all DDL — Hibernate must not create or validate tables
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_batch_fetch_size: 50

  # ── Flyway ────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # ── Kafka (outbox polling publisher sends events to oncall.identity.events) ─
  kafka:
    bootstrap-servers: ${oncall.kafka.bootstrap:localhost:9092}

  # ── Consul service discovery ──────────────────────────────────────────────
  cloud:
    consul:
      host: ${oncall.consul.host:localhost}
      port: ${oncall.consul.port:8500}
      discovery:
        service-name: ${spring.application.name}
        prefer-ip-address: true
        health-check-path: /health/live
        health-check-interval: 15s

# ── Actuator ──────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# ── JWT settings ──────────────────────────────────────────────────────────────
oncall:
  jwt:
    access-token-expiry-minutes: ${ONCALL_JWT_ACCESS_EXPIRY_MINUTES:30}
    refresh-token-expiry-days: ${ONCALL_JWT_REFRESH_EXPIRY_DAYS:7}
  kafka:
    bootstrap: ${ONCALL_KAFKA_BOOTSTRAP:localhost:9092}
  db:
    url: ${ONCALL_DB_URL:jdbc:postgresql://localhost:5432/oncall_identity}
    user: ${ONCALL_DB_USER:oncall}
    password: ${ONCALL_DB_PASSWORD:oncall_dev_change_me}
  consul:
    host: ${ONCALL_CONSUL_HOST:localhost}
    port: ${ONCALL_CONSUL_PORT:8500}

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    com.oncall.identity: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
