server:
  port: 8080

spring:
  application:
    name: config
  profiles:
    active: native

  cloud:
    config:
      server:
        # Native backend avoids external Git dependency for local development.
        native:
          search-locations: classpath:/config
    consul:
      host: ${oncall.consul.host:localhost}
      port: ${oncall.consul.port:8500}
      discovery:
        service-name: ${spring.application.name}
        prefer-ip-address: true
        health-check-path: /health
        health-check-interval: 15s
        enable-tag-override: true
        tags: "platform,config,infrastructure"
        meta:
          description: "Centralized configuration server for all services"
          type: "platform"
          domain: "config"
          version: "1.0.0"
          environment: "dev"

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

oncall:
  consul:
    host: ${ONCALL_CONSUL_HOST:localhost}
    port: ${ONCALL_CONSUL_PORT:8500}

logging:
  level:
    com.oncall.config: INFO
