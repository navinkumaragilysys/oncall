  # ─────────────────────────────── GATEWAY (single public door) ───────────────

  # api-gateway-service — JWT validation, @agilysys.com domain enforcement,
  # rate limiting, and routing.  Only port published to the host.
  gateway:
    image: ghcr.io/navinkumaragilysys/oncall-gateway:${ONCALL_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.svc
      args: { SVC_PATH: platform/gateway, SVC_JAR: gateway }
    container_name: oncall-gateway
    restart: unless-stopped
    environment:
      server.port: "8080"
      JAVA_TOOL_OPTIONS: "${GATEWAY_JAVA_OPTS:--Xms128m -Xmx512m -XX:+UseG1GC}"
      oncall.consul.host: consul
      oncall.consul.port: "8500"
      oncall.kafka.bootstrap: kafka:29092
      oncall.redis.host: redis
      oncall.redis.password: ${REDIS_PASSWORD:-redis_dev_change_me}
      # GET requests are forwarded synchronously to each downstream service.
      # POST/PUT/DELETE return 202 Accepted; command forwarded via Kafka command topic.
      oncall.gateway.allowed-email-domain: "@agilysys.com"
      oncall.gateway.rate-limit.requests-per-minute: "10000"
      # identity-svc JWKS URI — used by Spring Security to validate RS256 access tokens
      ONCALL_JWT_JWKS_URI: http://identity-svc:8080/api/v1/auth/.well-known/jwks.json
      otel.exporter.zipkin.endpoint: http://zipkin:9411/api/v2/spans
    deploy:
      resources:
        limits:
          memory: "${GATEWAY_MEM_LIMIT:-700m}"
        reservations:
          memory: 128m
    ports: ["${GATEWAY_HOST_PORT:-8090}:8080"]   # the ONLY app port published to the host
    networks: [oncall_network]
    depends_on:
      consul:           { condition: service_healthy }
      identity-svc:     { condition: service_started }
      team-policy-svc:  { condition: service_started }
      schedule-svc:     { condition: service_started }
      assignment-svc:   { condition: service_started }
      worklog-svc:      { condition: service_started }
      ticket-svc:       { condition: service_started }
      handover-svc:     { condition: service_started }
      availability-svc: { condition: service_started }
      approval-svc:     { condition: service_started }
      notification-svc: { condition: service_started }
      audit-svc:        { condition: service_started }
      reporting-svc:    { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
