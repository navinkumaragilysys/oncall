# On-Call Rotation Platform — local development stack (production-grade configuration).
#
# Architecture: 13 Spring Boot microservices + event-driven backbone (Kafka + Debezium outbox).
# READ operations: synchronous REST (GET only).
# All CUD operations: async via outbox table → Debezium CDC → Kafka → downstream consumers.
#
# All services share `oncall_network`; inter-container addressing is by service
# name on port 8080 (e.g. http://identity-svc:8080).  The only host-published app
# port is the gateway on 8090.
#
# Usage:
#   mvn clean install -DskipTests                 # build all JARs first (JDK 21)
#   docker compose up -d --build                  # build images + start everything
#
# Debezium connectors must be registered after kafka-connect is healthy:
#   POST http://localhost:8083/connectors         # register one connector per service DB
#   See infra/debezium/ for connector JSON configs per service.
#
# Prerequisites (create from infra/ templates):
#   infra/postgres/init-databases.sql             # creates all 12 service databases
#   infra/pgbouncer-userlist.txt                  # PgBouncer auth file
#   infra/otel-collector-config.yaml              # OTEL collector pipeline config
#   infra/prometheus/prometheus.yml               # Prometheus scrape config
#   infra/grafana/provisioning/                   # Grafana datasource + dashboard provisioning
#
# Port map (host → container):
#   5432  postgres         5433  pgbouncer         6379  redis
#   8500  consul           9092  kafka             8081  kafka-ui
#   8083  kafka-connect    9411  zipkin            4317  otel-collector (gRPC)
#   4318  otel-collector   9090  prometheus        3100  grafana
#   8888  config           9121  redis-exporter    8090  gateway (public entry point)

name: oncall

networks:
  oncall_network:
    name: oncall_network
    driver: bridge

# ── Named volumes (all stateful services get persistent storage) ─────────────
volumes:
  pgdata:
  redis_data:
  kafka_data:
  prometheus_data:
  grafana_data:

services:
  # ─────────────────────────────────────────── INFRASTRUCTURE ─────────────────

  # PostgreSQL — init-databases.sql creates one DB per microservice on first boot.
  postgres:
    image: postgres:16-alpine
    container_name: oncall-postgres
    restart: always
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - work_mem=${PG_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-128MB}
      - -c
      - wal_buffers=${PG_WAL_BUFFERS:-16MB}
      - -c
      - max_wal_size=${PG_MAX_WAL_SIZE:-1GB}
      - -c
      - min_wal_size=${PG_MIN_WAL_SIZE:-128MB}
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - synchronous_commit=${PG_SYNCHRONOUS_COMMIT:-off}
      - -c
      - random_page_cost=${PG_RANDOM_PAGE_COST:-1.1}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-2GB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-300}
      - -c
      - autovacuum_max_workers=${PG_AUTOVACUUM_MAX_WORKERS:-3}
      - -c
      - autovacuum_vacuum_scale_factor=${PG_AUTOVACUUM_VACUUM_SCALE:-0.05}
      - -c
      - autovacuum_analyze_scale_factor=${PG_AUTOVACUUM_ANALYZE_SCALE:-0.025}
      - -c
      - autovacuum_vacuum_cost_delay=${PG_AUTOVACUUM_COST_DELAY:-2ms}
      - -c
      - default_statistics_target=200
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - log_min_duration_statement=${PG_LOG_MIN_DURATION:-200}
      # Debezium CDC requires logical replication
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=${PG_MAX_REPLICATION_SLOTS:-20}
      - -c
      - max_wal_senders=${PG_MAX_WAL_SENDERS:-20}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oncall}
      POSTGRES_USER: ${POSTGRES_USER:-oncall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oncall_dev_change_me}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    networks: [oncall_network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oncall}"]
      interval: 5s
      timeout: 3s
      retries: 12

  # PgBouncer — transaction-mode connection pooler.
  # Business services connect to postgres:5432 directly for Flyway DDL transactions.
  # Switch to pgbouncer:6432 once Flyway is separated from the application lifecycle.
  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    container_name: oncall-pgbouncer
    restart: always
    environment:
      DATABASES_HOST: postgres
      DATABASES_PORT: "5432"
      DATABASES_USER: ${POSTGRES_USER:-oncall}
      DATABASES_PASSWORD: ${POSTGRES_PASSWORD:-oncall_dev_change_me}
      DATABASES_DBNAME: ${POSTGRES_DB:-oncall}
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: "2000"
      PGBOUNCER_DEFAULT_POOL_SIZE: "50"
      PGBOUNCER_MIN_POOL_SIZE: "10"
      PGBOUNCER_RESERVE_POOL_SIZE: "10"
      PGBOUNCER_MAX_DB_CONNECTIONS: "150"
      PGBOUNCER_SERVER_LIFETIME: "3600"
      PGBOUNCER_SERVER_IDLE_TIMEOUT: "300"
      PGBOUNCER_QUERY_TIMEOUT: "30"
      PGBOUNCER_IGNORE_STARTUP_PARAMETERS: "extra_float_digits,options"
      PGBOUNCER_AUTH_TYPE: trust
      PGBOUNCER_AUTH_FILE: /etc/pgbouncer/userlist.txt
    volumes:
      - ./infra/pgbouncer-userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports: ["5433:6432"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [oncall_network]
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 6432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  consul:
    image: hashicorp/consul:latest
    container_name: oncall-consul
    restart: always
    command: agent -dev -client=0.0.0.0
    ports: ["8500:8500"]
    networks: [oncall_network]
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Kafka in KRaft mode (no Zookeeper — Kafka 3.6+).
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: oncall-kafka
    restart: always
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: 0WL1kI1NQdi0DVeRDFPA4g
      KAFKA_HEAP_OPTS: "${KAFKA_HEAP_OPTS:--Xms512m -Xmx1g}"
      KAFKA_JVM_PERFORMANCE_OPTS: "-XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:+ExplicitGCInvokesConcurrent"
    volumes: ["kafka_data:/var/lib/kafka/data"]
    networks: [oncall_network]
    deploy:
      resources:
        limits:
          memory: "${KAFKA_MEM_LIMIT:-1300m}"
        reservations:
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: oncall-kafka-ui
    restart: unless-stopped
    ports: ["8081:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: oncall-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      JAVA_OPTS: "${KAFKA_UI_JAVA_OPTS:--Xms128m -Xmx384m}"
    deploy:
      resources:
        limits:
          memory: "${KAFKA_UI_MEM_LIMIT:-550m}"
        reservations:
          memory: 128m
    depends_on:
      kafka: { condition: service_healthy }
    networks: [oncall_network]

  redis:
    image: redis:7-alpine
    container_name: oncall-redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_dev_change_me}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    networks: [oncall_network]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev_change_me}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: oncall-zipkin
    restart: unless-stopped
    ports: ["9411:9411"]
    environment:
      JAVA_OPTS: "${ZIPKIN_JAVA_OPTS:--Xms128m -Xmx512m}"
    deploy:
      resources:
        limits:
          memory: "${ZIPKIN_MEM_LIMIT:-700m}"
        reservations:
          memory: 128m
    networks: [oncall_network]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9411/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: oncall-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    depends_on:
      zipkin: { condition: service_healthy }
    networks: [oncall_network]

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: oncall-node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports: ["9100:9100"]
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    networks: [oncall_network]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9100/metrics > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: oncall-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_change_me}
    ports: ["9121:9121"]
    depends_on:
      redis: { condition: service_healthy }
    networks: [oncall_network]

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: oncall-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    deploy:
      resources:
        limits:
          memory: "${PROMETHEUS_MEM_LIMIT:-512m}"
        reservations:
          memory: 64m
    ports: ["9090:9090"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks: [oncall_network]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana-oss:11.1.0
    container_name: oncall-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin_dev_change_me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports: ["3100:3000"]
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus: { condition: service_healthy }
    networks: [oncall_network]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────── OUTBOX / CDC RELAY ─────────────────

  # Debezium Kafka Connect — reads outbox_events tables via PostgreSQL logical replication
  # and publishes domain events to Kafka topics.  Register one connector per service DB:
  #   POST http://localhost:8083/connectors  <infra/debezium/{service}-connector.json>
  kafka-connect:
    image: quay.io/debezium/connect:2.7
    container_name: oncall-kafka-connect
    restart: unless-stopped
    ports: ["8083:8083"]
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: oncall-debezium-cg
      CONFIG_STORAGE_TOPIC: oncall.debezium.configs
      OFFSET_STORAGE_TOPIC: oncall.debezium.offsets
      STATUS_STORAGE_TOPIC: oncall.debezium.status
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      JAVA_OPTS: "${DEBEZIUM_JAVA_OPTS:--Xms128m -Xmx512m}"
    deploy:
      resources:
        limits:
          memory: "${DEBEZIUM_MEM_LIMIT:-700m}"
        reservations:
          memory: 128m
    depends_on:
      kafka:    { condition: service_healthy }
      postgres: { condition: service_healthy }
    networks: [oncall_network]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s

  # ─────────────────────────────────────────── PLATFORM ───────────────────────

  # Spring Cloud Config Server — centralised configuration for all business services.
  config:
    image: ghcr.io/navinkumaragilysys/oncall-config:${ONCALL_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.svc
      args: { SVC_PATH: platform/config, SVC_JAR: config }
    container_name: oncall-config
    restart: unless-stopped
    environment:
      server.port: "8080"
      JAVA_TOOL_OPTIONS: "${CONFIG_JAVA_OPTS:--Xms64m -Xmx256m -XX:+UseG1GC}"
    deploy:
      resources:
        limits:
          memory: "${CONFIG_MEM_LIMIT:-384m}"
        reservations:
          memory: 64m
    ports: ["8888:8080"]
    networks: [oncall_network]
    depends_on:
      consul: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ─────────────────────────────────────── BUSINESS SERVICES ──────────────────
  # All CUD operations write to their own outbox_events table (same DB transaction).
  # Debezium CDC relay above publishes those rows to the corresponding Kafka topic.
  # GET endpoints are synchronous REST served from each service's own read model.

  # 1. identity-svc — Member, member_system_roles, NotificationPreference
  identity-svc:
    image: ghcr.io/navinkumaragilysys/oncall-identity-svc:${ONCALL_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.svc
      args: { SVC_PATH: services/identity-svc, SVC_JAR: identity-svc }
    container_name: oncall-identity
    restart: unless-stopped
    environment:
      server.port: "8080"
      JAVA_TOOL_OPTIONS: "${IDENTITY_JAVA_OPTS:--Xms128m -Xmx512m -XX:+UseG1GC}"
      oncall.db.url: jdbc:postgresql://postgres:5432/oncall_identity
      oncall.db.user: ${POSTGRES_USER:-oncall}
      oncall.db.password: ${POSTGRES_PASSWORD:-oncall_dev_change_me}
      oncall.consul.host: consul
      oncall.consul.port: "8500"
      oncall.kafka.bootstrap: kafka:29092
      oncall.redis.host: redis
      oncall.redis.password: ${REDIS_PASSWORD:-redis_dev_change_me}
      ONCALL_ADVERTISE_HOST: identity-svc
      otel.exporter.zipkin.endpoint: http://zipkin:9411/api/v2/spans
    deploy:
      resources:
        limits:
          memory: "${IDENTITY_MEM_LIMIT:-700m}"
        reservations:
          memory: 128m
    networks: [oncall_network]
    depends_on:
      postgres: { condition: service_healthy }
      kafka:    { condition: service_healthy }
      consul:   { condition: service_healthy }
      config:   { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # 2. team-policy-svc — Team, TeamMembership, RotationPolicy, SubSessionDefinition, ShiftDefinition, HolidayCalendar
  team-policy-svc:
    image: ghcr.io/navinkumaragilysys/oncall-team-policy-svc:${ONCALL_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.svc
      args: { SVC_PATH: services/team-policy-svc, SVC_JAR: team-policy-svc }
    container_name: oncall-team-policy
    restart: unless-stopped
    environment:
      server.port: "8080"
      JAVA_TOOL_OPTIONS: "${TEAM_POLICY_JAVA_OPTS:--Xms128m -Xmx512m -XX:+UseG1GC}"
      oncall.db.url: jdbc:postgresql://postgres:5432/oncall_team
      oncall.db.user: ${POSTGRES_USER:-oncall}
      oncall.db.password: ${POSTGRES_PASSWORD:-oncall_dev_change_me}
      oncall.consul.host: consul
      oncall.consul.port: "8500"
      oncall.kafka.bootstrap: kafka:29092
      oncall.redis.host: redis
      oncall.redis.password: ${REDIS_PASSWORD:-redis_dev_change_me}
      ONCALL_ADVERTISE_HOST: team-policy-svc
      otel.exporter.zipkin.endpoint: http://zipkin:9411/api/v2/spans
    deploy:
      resources:
        limits:
          memory: "${TEAM_POLICY_MEM_LIMIT:-700m}"
        reservations:
          memory: 128m
    networks: [oncall_network]
    depends_on:
      postgres:     { condition: service_healthy }
      kafka:        { condition: service_healthy }
      consul:       { condition: service_healthy }
      config:       { condition: service_started }
      identity-svc: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # 3. schedule-svc — OnCallSession lifecycle (DRAFT → PUBLISHED), allocation engine
  schedule-svc:
    image: ghcr.io/navinkumaragilysys/oncall-schedule-svc:${ONCALL_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.svc
      args: { SVC_PATH: services/schedule-svc, SVC_JAR: schedule-svc }
    container_name: oncall-schedule
    restart: unless-stopped
    environment:
      server.port: "8080"
      # Larger heap — allocation engine is CPU and memory intensive.
      JAVA_TOOL_OPTIONS: "${SCHEDULE_JAVA_OPTS:--Xms256m -Xmx768m -XX:+UseG1GC}"
      oncall.db.url: jdbc:postgresql://postgres:5432/oncall_schedule
      oncall.db.user: ${POSTGRES_USER:-oncall}
      oncall.db.password: ${POSTGRES_PASSWORD:-oncall_dev_change_me}
      oncall.consul.host: consul
      oncall.consul.port: "8500"
      oncall.kafka.bootstrap: kafka:29092
      oncall.redis.host: redis
      oncall.redis.password: ${REDIS_PASSWORD:-redis_dev_change_me}
      ONCALL_ADVERTISE_HOST: schedule-svc
      otel.exporter.zipkin.endpoint: http://zipkin:9411/api/v2/spans
    deploy:
      resources:
        limits:
          memory: "${SCHEDULE_MEM_LIMIT:-1g}"
        reservations:
          memory: 256m
    networks: [oncall_network]
    depends_on:
      postgres:        { condition: service_healthy }
      kafka:           { condition: service_healthy }
      consul:          { condition: service_healthy }
      config:          { condition: service_started }
      team-policy-svc: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # 4. assignment-svc — OnCallAssignment (PUBLISHED onward), OnCallHistory, fairness credit
  assignment-svc:
    image: ghcr.io/navinkumaragilysys/oncall-assignment-svc:${ONCALL_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.svc
      args: { SVC_PATH: services/assignment-svc, SVC_JAR: assignment-svc }
    container_name: oncall-assignment
    restart: unless-stopped
    environment:
      server.port: "8080"
      JAVA_TOOL_OPTIONS: "${ASSIGNMENT_JAVA_OPTS:--Xms128m -Xmx512m -XX:+UseG1GC}"
      oncall.db.url: jdbc:postgresql://postgres:5432/oncall_assignment
      oncall.db.user: ${POSTGRES_USER:-oncall}
      oncall.db.password: ${POSTGRES_PASSWORD:-oncall_dev_change_me}
      oncall.consul.host: consul
      oncall.consul.port: "8500"
      oncall.kafka.bootstrap: kafka:29092
      oncall.redis.host: redis
      oncall.redis.password: ${REDIS_PASSWORD:-redis_dev_change_me}
      ONCALL_ADVERTISE_HOST: assignment-svc
      otel.exporter.zipkin.endpoint: http://zipkin:9411/api/v2/spans
    deploy:
      resources:
        limits:
          memory: "${ASSIGNMENT_MEM_LIMIT:-700m}"
        reservations:
          memory: 128m
    networks: [oncall_network]
    depends_on:
      postgres:     { condition: service_healthy }
      kafka:        { condition: service_healthy }
      consul:       { condition: service_healthy }
      config:       { condition: service_started }
